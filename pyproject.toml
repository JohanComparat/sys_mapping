[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sys_mapping"
version = "1.3.0"
description = "Joint inference of multiplicative and additive systematics in galaxy clustering"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Johan Comparat", email = "jcomparat@lpsc.in2p3.fr"},
]
keywords = ["astronomy", "galaxy clustering", "systematic effects", "HEALPix", "MCMC", "decontamination"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "healpy",
    "emcee",
    "jax[cpu]>=0.9",
    # <1.6: 1.6.2 forwards window_adaptation's progress_bar to the NUTS
    # kernel, which rejects it, breaking every MCMC-add/MCMC-comb run.
    "blackjax>=1.2,<1.6",
    "joblib",
    "treecorr",
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/JohanComparat/sys_mapping"
Documentation = "https://johancomparat.github.io/sys_mapping"
Source = "https://github.com/JohanComparat/sys_mapping"

[project.optional-dependencies]
regression = ["scikit-learn>=1.3"]
glass = ["glass>=2026.1"]
corrfunc = ["corrfunc"]
dev = [
    "pytest",
    "pytest-cov",
    "matplotlib",
    "scikit-learn>=1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sys_mapping*"]
